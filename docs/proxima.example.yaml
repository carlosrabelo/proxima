# Example Proxima configuration (YAML).
# Copy this file and replace placeholder secrets before use.

proxmox_host: "192.168.1.10"
proxmox_port: 8006
ssh_port: 22
node: "pve"

# Password authentication (default in this example):
user: "root@pam"
password: "secret"
# Token authentication (alternative — comment out user/password above and uncomment):
# token_id: "root@pam!proxima"
# token_secret: "uuid-secret"

vmid: 200
name: "alpine-docker"
memory: 2048
cores: 2
disk_size: "8G"
root_password: "change-me"
# Optional: bake an OpenSSH public key into the guest image for root login:
# guest_ssh_public_key_path: "~/.ssh/id_rsa.pub"
storage: "local-lvm"
bridge: "vmbr0"
output: "vms/alpine-ready.qcow2"
work_dir: ".proxima-work"
insecure_tls: false
# Optional SSH overrides for the Proxmox node (token auth requires ssh_private_key_path):
# ssh_user: "root"
# ssh_private_key_path: "~/.ssh/id_ed25519"
